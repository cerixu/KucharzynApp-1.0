<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kucharzyna">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="apple-touch-startup-image" href="./splash-17-pro-max.png" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="./splash-17-pro-max-landscape.png" media="screen and (device-width: 956px) and (device-height: 440px) and (-webkit-device-pixel-ratio: 3)">
<link rel="stylesheet" href="./styles.css">
<title>Kucharzyna</title>
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar safe-top">
    <button id="globalBack" class="global-back" aria-label="Powrót">←</button>
    <div class="topbar-brand">
      <div id="topbarTitle" class="topbar-title">Kucharzyna</div>
    </div>
    <div class="topbar-actions"><button id="globalSettings" class="icon-btn" aria-label="Ustawienia">⚙</button><button id="themeBtn" class="icon-btn" aria-label="Zmień motyw">◐</button></div>
  </header>

  <main id="main" class="main-scroll" tabindex="-1"></main>

  <nav class="bottom-nav safe-bottom" aria-label="Główna nawigacja">
    <button data-route="start" class="nav-btn active"><span>⌂</span><small>Start</small></button>
    <button data-route="recipes" class="nav-btn"><span>▤</span><small>Receptury</small></button>
    <button data-route="traditional" class="nav-btn"><span>★</span><small>Tradycyjne</small></button>
    <button data-route="calculators" class="nav-btn"><span>∑</span><small>Kalkulatory</small></button>
    <button data-route="shopping" class="nav-btn"><span>✓</span><small>Zakupy</small></button>
    <button data-route="settings" class="nav-btn"><span>⚙</span><small>Ustawienia</small></button>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="./db.js"></script>
<script src="./app.js"></script>
</body>
</html>
