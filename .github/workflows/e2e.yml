name: Kucharzyna E2E

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Kucharzyna E2E
        run: npx playwright test --project=iphone-17-pro-max --project=desktop-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kucharzyna-playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
